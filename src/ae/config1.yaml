seed: 42

data:
  dataset:
    root: ${oc.env:ERA5_DATA_ROOT,../../data/era5}
    timesteps: 32
    variables:
      - 2m_temperature
      - 10m_u_component_of_wind
      - 10m_v_component_of_wind
      - mean_sea_level_pressure
      - geopotential_50
      - geopotential_100
      - geopotential_150
      - geopotential_200
      - geopotential_250
      - geopotential_300
      - geopotential_400
      - geopotential_500
      - geopotential_600
      - geopotential_700
      - geopotential_850
      - geopotential_925
      - geopotential_1000
      - u_component_of_wind_50
      - u_component_of_wind_100
      - u_component_of_wind_150
      - u_component_of_wind_200
      - u_component_of_wind_250
      - u_component_of_wind_300
      - u_component_of_wind_400
      - u_component_of_wind_500
      - u_component_of_wind_600
      - u_component_of_wind_700
      - u_component_of_wind_850
      - u_component_of_wind_925
      - u_component_of_wind_1000
      - v_component_of_wind_50
      - v_component_of_wind_100
      - v_component_of_wind_150
      - v_component_of_wind_200
      - v_component_of_wind_250
      - v_component_of_wind_300
      - v_component_of_wind_400
      - v_component_of_wind_500
      - v_component_of_wind_600
      - v_component_of_wind_700
      - v_component_of_wind_850
      - v_component_of_wind_925
      - v_component_of_wind_1000
      - temperature_50
      - temperature_100
      - temperature_150
      - temperature_200
      - temperature_250
      - temperature_300
      - temperature_400
      - temperature_500
      - temperature_600
      - temperature_700
      - temperature_850
      - temperature_925
      - temperature_1000
      - specific_humidity_50
      - specific_humidity_100
      - specific_humidity_150
      - specific_humidity_200
      - specific_humidity_250
      - specific_humidity_300
      - specific_humidity_400
      - specific_humidity_500
      - specific_humidity_600
      - specific_humidity_700
      - specific_humidity_850
      - specific_humidity_925
      - specific_humidity_1000
  batch_size: 2
  val_batch_size: 2
  drop_last: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

model:
  # Same model size / channels / latent geometry as config.yaml. The only
  # difference is the decoder is conditioned on static surface fields, fed in
  # (reshaped) at every decoder level -> use the model1 implementation.
  impl: surface_cond
  cond_variables:
    - land_sea_mask
    - geopotential_at_surface
  cond_normalize: true      # z-score the static fields with the dataset stats
  cond_split: train         # which split to read the (time-invariant) fields from
  cond_interp_mode: area    # how to resize the field to each decoder level's grid
  cond_kernel: 3            # per-level conditioning conv kernel
  cond_zero_init: true      # start as the unconditioned decoder, then learn the conditioning
  gradient_checkpointing: true
  z_channels: 128
  hid_channels: [96, 192, 384, 768]
  hid_blocks: [3, 3, 3, 3]
  decoder_extra_blocks: 1
  saturation: softclip2
  saturation_scale: 10.0
  dropout: 0.05
  expected_latent_shape: [128, 8, 32, 64]
  downsample_strides:
    - [1, 2, 2]
    - [2, 2, 2]
    - [2, 1, 1]

optim:
  lr: 5.0e-4
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 0.0
  eta_min: 1.0e-8
  ema_decay: null

train:
  output_dir: outputs/ae_128x8x32x64_surfcond   # fresh dir for the surface-conditioned run
  finetune_from: null   # new decoder layers -> the old checkpoint is not load-compatible; train fresh
  device: auto
  precision: bf16
  epochs: 200
  validate_every_epochs: 1
  resume: true
  latent_noise_std: 0.02
  gradient_accumulation_steps: 4
  grad_clip_norm: 5.0
  log_every_steps: 20
  max_steps: null
  limit_train_batches: null
  limit_val_batches: 20
  allow_tf32: true
  cudnn_benchmark: true

loss:
  variance_normalized_mse: true
  variance_epsilon: 1.0e-2
  latitude_weight: true
  variable_weights: null
  spatial_gradient_loss_weight: 0.05
  laplacian_loss_weight: 0.05
  temporal_difference_loss_weight: 0.05
